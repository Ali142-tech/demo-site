services:
  - type: web
    name: printtime
    runtime: docker
    plan: starter            # needed for a persistent disk (uploads). "free" works but uploads vanish on redeploy.
    healthCheckPath: /up
    disk:
      name: uploads
      mountPath: /var/www/html/storage/app
      sizeGB: 5
    envVars:
      - key: APP_NAME
        value: PrintTime
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true   # replace with output of `php artisan key:generate --show` ("base64:...") if the app errors
      - key: APP_URL
        sync: false           # e.g. https://printtime.onrender.com
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        fromDatabase: { name: printtime-db, property: connectionString }
      - key: SESSION_DRIVER
        value: database
      - key: LOG_CHANNEL
        value: stderr
      - key: MAIL_MAILER
        value: log            # switch to smtp + MAIL_HOST/PORT/USERNAME/PASSWORD for real emails
      - key: BUSINESS_NAME
        value: PrintTime
      - key: BUSINESS_PHONE
        sync: false
      - key: BUSINESS_WHATSAPP
        sync: false
      - key: BUSINESS_EMAIL
        sync: false
      - key: BUSINESS_ADDRESS
        sync: false

databases:
  - name: printtime-db
    plan: free
